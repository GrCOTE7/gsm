name: APK debug

# Temporary workflow used to diagnose `flet build apk` without creating a
# release or deploying. Safe to delete once the APK build is green again.

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version bundled by serious_python"
        type: string
        default: "3.14"
      jni_override:
        description: "jni version forced in build/flutter/pubspec.yaml (empty = no patch)"
        type: string
        default: "^1.2.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,desktop]"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Build APK (attempt 1)
        shell: bash
        run: |
          set -o pipefail
          flet build apk -vv --yes \
            --python-version "${{ inputs.python_version }}" \
            2>&1 | tee flet-build.log || echo "::warning::attempt 1 failed"

      - name: Inspect and patch generated pubspec
        shell: bash
        run: |
          set -uo pipefail
          pubspec=build/flutter/pubspec.yaml
          {
            echo "===== generated pubspec.yaml ====="
            cat "$pubspec" 2>/dev/null || echo "(missing $pubspec)"
          } | tee -a flet-build.log

          jni_version="${{ inputs.jni_override }}"
          if [ -z "$jni_version" ] || [ ! -f "$pubspec" ]; then
            echo "No jni patch requested/found."
            exit 0
          fi

          python - "$pubspec" "$jni_version" <<'PY' | tee -a flet-build.log
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          version = sys.argv[2]
          text = path.read_text(encoding="utf-8")
          patched, count = re.subn(
              r"(?m)^(\s*)jni:\s*.*$", lambda m: f"{m.group(1)}jni: {version}", text
          )
          if count == 0:
              patched = text.rstrip() + "\n\ndependency_overrides:\n  jni: " + version + "\n"
              print("jni not found: appended a dependency_overrides block")
          else:
              print(f"jni override patched to {version} ({count} occurrence(s))")
          path.write_text(patched, encoding="utf-8")
          PY

          grep -n -B2 -A2 "jni" "$pubspec" | head -n 20 | tee -a flet-build.log

      - name: Build APK (attempt 2)
        shell: bash
        run: |
          set -o pipefail
          flet build apk -vv --yes \
            --python-version "${{ inputs.python_version }}" \
            2>&1 | tee -a flet-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flet-build-log-debug
          path: flet-build.log

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: build/apk/*.apk
          if-no-files-found: ignore
