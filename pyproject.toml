[project]
name = "GSM"
version = "1.0.36"
description = "Up U!"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "GrCOTE7", email = "GrCOTE7@gmail.com" }]
dependencies = [
    "flet==1.0.0",
    "flet-audio",
    "certifi",
    "google-api-python-client>=2.196.0",
    "google-auth>=2.51.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "pymox_kit",
    "rich>=15.0.0",
    "qrcode[pil]>=8.2",
    "pytest>=8.0.0",
    "flet-webview>=1.0.0",
    "typing-extensions>=4.16.0",
    "pywin32; sys_platform == 'win32'",
]

[project.optional-dependencies]
desktop = ["flet-cli", "flet-desktop", "pyshorteners>=1.0.1"]
web = ["flet-web==1.0.0"]
dev = ["pytest>=8.0.0"]

[tool.flet]
org = "com.mycompany"
product = "Up You!"
company = "NewNRJ"
copyright = "Copyright (C) 2026 by GrCOTE7"
compile.app = true
compile.packages = true
cleanup.packages = false
build_number = 1

[tool.flet.app]
path = "src"

[tool.flet.android]
split_per_abi = false
min_sdk_version = 24
target_sdk_version = 35

[tool.flet.splash]
android = false

# flet 1.0.0's Flutter template pins jni 1.0.0, but the bundled jni_flutter 1.1.0
# calls JReference.nonNullPointer, which that jni version does not expose:
# `flet build apk` then fails with "The getter 'nonNullPointer' isn't defined".
[tool.flet.flutter.pubspec.dependency_overrides]
jni = "^1.2.1"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# [tool.flet.android.permission]
# "android.permission.CAMERA" = true

# [tool.flet.android.feature] # --android-features
# "android.hardware.camera" = true

# uv run pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
